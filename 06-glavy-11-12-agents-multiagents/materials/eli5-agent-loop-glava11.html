<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Круг агента</title>
<style>
body{font-family:var(--font-sans,system-ui);color:var(--foreground);margin:0;padding:8px 4px;font-size:15px;line-height:1.5}
.wrap{max-width:900px}
svg{width:100%;height:auto;display:block}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.5}
.box-hl{fill:none;stroke:var(--accent);stroke-width:2.5}
.t-main{font-size:16px;font-weight:700;fill:var(--foreground)}
.t-sub{font-size:13px;fill:var(--muted-foreground)}
.t-tech{font-size:12.5px;fill:var(--foreground);opacity:.85}
.t-hl{font-size:13.5px;font-weight:700;fill:var(--accent)}
.arrow{stroke:var(--muted-foreground);stroke-width:2;fill:none;marker-end:url(#ah10)}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ah10" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
<polygon points="0 0, 9 3.5, 0 7" fill="var(--muted-foreground)"/>
</marker>
</defs>

<rect x="40" y="30" width="240" height="64" class="box"/>
<text x="160" y="56" text-anchor="middle" class="t-main">Модель</text>
<text x="160" y="78" text-anchor="middle" class="t-sub">смотрит на вопрос и историю</text>

<rect x="620" y="30" width="240" height="64" class="box"/>
<text x="740" y="56" text-anchor="middle" class="t-main">Заявка, не ответ</text>
<text x="740" y="78" text-anchor="middle" class="t-sub">имя функции + аргументы</text>

<rect x="620" y="180" width="240" height="64" class="box"/>
<text x="740" y="206" text-anchor="middle" class="t-main">Программа исполняет</text>
<text x="740" y="228" text-anchor="middle" class="t-sub">настоящий код, настоящий поиск</text>

<rect x="40" y="180" width="240" height="64" class="box"/>
<text x="160" y="206" text-anchor="middle" class="t-main">Результат</text>
<text x="160" y="228" text-anchor="middle" class="t-sub">возвращается в список сообщений</text>

<rect x="330" y="180" width="240" height="64" class="box box-hl"/>
<text x="450" y="206" text-anchor="middle" class="t-main">Состояние</text>
<text x="450" y="228" text-anchor="middle" class="t-sub">все сообщения круга, растёт</text>

<line x1="280" y1="62" x2="616" y2="62" class="arrow"/>
<text x="448" y="50" text-anchor="middle" class="t-tech">решает: звать инструмент</text>

<line x1="740" y1="94" x2="740" y2="176" class="arrow"/>
<text x="748" y="140" class="t-tech">заявка уходит в код</text>

<line x1="616" y1="212" x2="284" y2="212" class="arrow"/>
<text x="450" y="200" text-anchor="middle" class="t-tech">результат + ссылка на заявку</text>

<line x1="160" y1="176" x2="160" y2="98" class="arrow"/>
<text x="168" y="140" class="t-tech">модель читает</text>

<text x="450" y="290" text-anchor="middle" class="t-hl">Условие выхода - после каждого возврата:</text>
<text x="450" y="314" text-anchor="middle" class="t-sub">данных достаточно? - ответ пользователю. Нет - новый круг по инструментам</text>

<text x="450" y="360" text-anchor="middle" class="t-hl">Два якоря безопасности, оба в коде:</text>
<text x="450" y="384" text-anchor="middle" class="t-tech">счётчик оборотов (иначе вечный цикл) и добавка к скору за ссылку заявка-результат (иначе круг рвётся)</text>
<text x="450" y="408" text-anchor="middle" class="t-tech">второй инструмент не меняет круг - меняется список инструментов</text>
</svg>
</div>
</body>
</html>
